<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한정선 모찌 먹방</title>
<style>
:root{box-sizing:border-box;--bg:#fff5f8;--ink:#5a3a4a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d25;--ink:#ffe6ef}}
:root[data-theme="dark"]{--bg:#2a1d25;--ink:#ffe6ef}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;height:100%;max-height:100%;aspect-ratio:9/16;max-width:100%;background:linear-gradient(160deg,#ffd6e7,#e6dcff);overflow:hidden;border-radius:18px}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);font-weight:700}
#pips span{display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff;margin-right:4px;opacity:.9}
#pips span.on{background:#ff7aa8}
#name{position:absolute;bottom:70px;width:100%;text-align:center;color:#fff;font-weight:800;font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#msg{position:absolute;bottom:18px;width:100%;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.6);padding:0 12px}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,235,244,.92);color:#5a3a4a;text-align:center;padding:20px}
#start button{font-size:18px;font-weight:800;border:0;border-radius:999px;padding:14px 32px;background:#ff7aa8;color:#fff}
h1{margin:0;font-size:26px}
</style></head><body>
<div id="stage">
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div id="hud"><div>🍡 <span id="score">0</span>개 먹음</div><div id="pips"></div></div>
<div id="name"></div>
<div id="msg"></div>
<div id="start"><h1>🍡 한정선 모찌 먹방</h1>
<div>카메라를 켜고 입을 크게 벌렸다 다물면 한 입!<br>모찌 하나당 최대 5번 먹을 수 있어요.<br>(얼굴 인식이 안 되면 화면 탭 / 스페이스바로 한 입)</div>
<button id="go">시작하기</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),vid=$('v');
let W=0,H=0;
function resize(){W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight}
addEventListener('resize',resize);

const WRAPS=['#ffc8dd','#c9f0c4','#dccbff'];
const TYPES=[
 {k:'shine',n:'샤인머스켓 그릭요거트 모찌'},{k:'fig',n:'무화과 그릭요거트 모찌'},
 {k:'peach',n:'복숭아 그릭요거트 모찌'},{k:'straw',n:'딸기 그릭요거트 모찌'},
 {k:'mango',n:'망고 그릭요거트 모찌'},{k:'dubai',n:'두바이 모찌'},{k:'choco',n:'생초코 모찌'}];
const MAXB=5;
let cur=null,score=0,lastK='',mouth={x:.5,y:.62,open:0,ok:false},pos={x:0,y:0};

function circle(c,x,y,r,f){c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=f;c.fill()}
function fruit(c,k,r){
 if(k==='shine'){circle(c,0,0,r,'#b5d96a');circle(c,0,0,r*.8,'#d4ec8c');circle(c,-r*.3,-r*.3,r*.22,'rgba(255,255,255,.7)')}
 else if(k==='fig'){c.beginPath();c.ellipse(0,0,r,r*.92,0,0,7);c.fillStyle='#6b3a6e';c.fill();
  circle(c,0,0,r*.72,'#ff8fa3');circle(c,0,0,r*.4,'#ffc2cc');for(let i=0;i<14;i++){const a=i*2.4,d=r*(.15+.5*(i%5)/5);circle(c,Math.cos(a)*d,Math.sin(a)*d,r*.05,'#b23a55')}}
 else if(k==='peach'){circle(c,0,0,r,'#ffb37a');circle(c,0,0,r*.8,'#ffd9a8');circle(c,r*.25,r*.2,r*.5,'rgba(255,140,150,.55)');c.beginPath();c.ellipse(0,0,r*.2,r*.32,.5,0,7);c.fillStyle='#b5673a';c.fill()}
 else if(k==='straw'){c.beginPath();c.moveTo(0,r);c.bezierCurveTo(-r*1.4,r*.1,-r*.9,-r,0,-r*.7);c.bezierCurveTo(r*.9,-r,r*1.4,r*.1,0,r);c.fillStyle='#ff4d6d';c.fill();
  c.beginPath();c.moveTo(0,r*.6);c.bezierCurveTo(-r*.8,0,-r*.5,-r*.5,0,-r*.4);c.bezierCurveTo(r*.5,-r*.5,r*.8,0,0,r*.6);c.fillStyle='#ffb3c1';c.fill();
  for(let i=0;i<6;i++)circle(c,(i%3-1)*r*.3,(i>2?.25:-.1)*r,r*.04,'#fff')}
 else if(k==='mango'){c.beginPath();c.ellipse(0,0,r*1.05,r*.85,-.4,0,7);c.fillStyle='#ffb52e';c.fill();
  c.beginPath();c.ellipse(0,0,r*.8,r*.62,-.4,0,7);c.fillStyle='#ffd45c';c.fill();circle(c,-r*.25,-r*.2,r*.15,'rgba(255,255,255,.5)')}
}
function body(c,t,r){
 const dub=t.k==='dubai',cho=t.k==='choco';
 circle(c,0,0,r,dub?'#f2e3c6':cho?'#e8d5c8':'#fffdfa');
 if(cho)circle(c,0,0,r*.92,'#4a2a1c');
 if(dub){circle(c,0,0,r*.95,'#6b4a2e');for(let i=0;i<40;i++){const a=i*2.4,d=r*(.7+.25*(i%7)/7);circle(c,Math.cos(a)*d,Math.sin(a)*d,r*.05,'#c9a35e')}}
 if(!dub&&!cho)circle(c,0,0,r*.84,'#fff8ef');
 c.save();
 if(dub){circle(c,0,0,r*.68,'#8bb04a');for(let i=0;i<30;i++){const a=i*1.9,d=r*.6*(i%6)/6;c.strokeStyle='#c7e07a';c.lineWidth=r*.03;c.beginPath();c.moveTo(Math.cos(a)*d,Math.sin(a)*d);c.lineTo(Math.cos(a)*d+r*.12,Math.sin(a)*d+r*.06);c.stroke()}circle(c,0,0,r*.3,'#f3f0d0')}
 else if(cho){circle(c,0,0,r*.72,'#3a1e12');circle(c,0,0,r*.5,'#5c3322');circle(c,-r*.2,-r*.2,r*.15,'rgba(255,255,255,.2)')}
 else{circle(c,0,0,r*.72,'#fff');fruit(c,t.k,r*.5)}
 c.restore();
 if(!dub&&!cho){c.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<12;i++)circle(c,Math.cos(i*2.1)*r*.95,Math.sin(i*2.1)*r*.95,r*.04,'rgba(255,255,255,.8)')}
}
function wrap(c,col,r){
 c.save();c.fillStyle=col;c.globalAlpha=.5;
 circle(c,0,0,r*1.12,col);
 c.beginPath();c.moveTo(-r*.3,-r*.95);c.lineTo(-r*.75,-r*1.5);c.lineTo(-r*.15,-r*1.25);c.lineTo(0,-r*1.65);c.lineTo(r*.15,-r*1.25);c.lineTo(r*.75,-r*1.5);c.lineTo(r*.3,-r*.95);c.closePath();c.fill();
 c.globalAlpha=.9;c.strokeStyle=col;c.lineWidth=r*.05;
 for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(i*r*.08,-r*1.05);c.lineTo(i*r*.14,-r*.7);c.stroke()}
 c.globalAlpha=.5;circle(c,-r*.45,-r*.5,r*.18,'#fff');
 c.restore();
}
function spawn(){
 let t;do{t=TYPES[Math.random()*TYPES.length|0]}while(t.k===lastK);
 lastK=t.k;
 const R=Math.min(W,H)*.2,off=document.createElement('canvas');off.width=off.height=Math.ceil(R*4);
 const o=off.getContext('2d');
 cur={t,R,off,o,bites:0,a0:Math.random()*6.28,born:performance.now(),shake:0,wc:WRAPS[Math.random()*3|0],eaten:false,fade:0};
 redraw();
 $('name').textContent=t.n;updatePips();
}
function redraw(){
 const {o,off,R,t,wc}=cur;o.clearRect(0,0,off.width,off.height);o.save();o.translate(off.width/2,off.height/2);
 body(o,t,R);wrap(o,wc,R);
 o.globalCompositeOperation='destination-out';
 for(let i=0;i<cur.bites;i++){const a=cur.a0+i*1.2566;
  if(cur.bites>=MAXB){o.fillStyle='#000';o.fillRect(-R*3,-R*3,R*6,R*6)}
  else{circle(o,Math.cos(a)*R*.6,Math.sin(a)*R*.6,R*.7,'#000')}}
 o.restore();
}
function updatePips(){$('pips').innerHTML=Array.from({length:MAXB},(_,i)=>`<span class="${cur&&i<MAXB-cur.bites?'on':''}"></span>`).join('')}
function bite(){
 if(!cur||cur.eaten||performance.now()-cur.born<500)return;
 cur.bites=Math.min(MAXB,cur.bites+(mouth.open>.7?2:1));
 cur.shake=1;redraw();updatePips();
 if(cur.bites>=MAXB){cur.eaten=true;score++;$('score').textContent=score;$('name').textContent='냠냠! 맛있다 😋';
  setTimeout(spawn,900)}
}

let wasOpen=false,lastBite=0;
function tick(now){
 ctx.clearRect(0,0,W,H);
 if(mouth.ok){pos.x+=(mouth.x*W-pos.x)*.3;pos.y+=(mouth.y*H-pos.y)*.3}
 else{pos.x=W/2;pos.y=H*.6}
 // 입 벌렸다 다물면 한 입
 const open=mouth.ok&&mouth.open>.35;
 if(wasOpen&&!open&&now-lastBite>450){bite();lastBite=now}
 wasOpen=open;
 if(cur&&!(cur.eaten&&cur.bites>=MAXB)){
  const age=Math.min(1,(now-cur.born)/450),s=1-Math.pow(1-age,3);
  const bob=Math.sin(now/300)*4,sh=cur.shake>0?Math.sin(now/25)*cur.shake*8:0;
  cur.shake=Math.max(0,cur.shake-.05);
  ctx.save();ctx.translate(pos.x+sh,pos.y-H*.1+bob);ctx.scale(s,s);
  ctx.drawImage(cur.off,-cur.off.width/2,-cur.off.height/2);ctx.restore();
 }
 requestAnimationFrame(tick);
}

async function initFace(){
 try{
  const m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const fs=await m.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const fl=await m.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},runningMode:'VIDEO',outputFaceBlendshapes:true,numFaces:1});
  $('msg').textContent='입을 크게 벌렸다 다물어 보세요!';
  let last=-1;
  (function loop(){
   if(vid.readyState>=2&&vid.currentTime!==last){last=vid.currentTime;
    const r=fl.detectForVideo(vid,performance.now());
    if(r.faceLandmarks&&r.faceLandmarks[0]){
     const L=r.faceLandmarks[0],vw=vid.videoWidth,vh=vid.videoHeight,sc=Math.max(W/vw,H/vh);
     const lip=L[13],px=W-(lip.x*vw*sc-(vw*sc-W)/2),py=lip.y*vh*sc-(vh*sc-H)/2;
     const jaw=(r.faceBlendshapes[0].categories.find(c=>c.categoryName==='jawOpen')||{}).score||0;
     mouth={x:px/W,y:py/H,open:jaw,ok:true};
    }else mouth.ok=false;
   }
   requestAnimationFrame(loop);
  })();
 }catch(e){$('msg').textContent='얼굴 인식을 못 불러왔어요 → 화면을 탭하거나 스페이스바로 한 입!'}
}
async function start(){
 $('start').style.display='none';resize();
 $('msg').textContent='카메라 준비 중…';
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});vid.srcObject=s;await vid.play()}
 catch(e){$('msg').textContent='카메라를 못 켰어요. 탭/스페이스바로 한 입!'}
 spawn();requestAnimationFrame(tick);
 if(vid.srcObject)initFace();else{}
}
$('go').onclick=start;
$('stage').addEventListener('pointerdown',e=>{if(e.target.id!=='go')bite()});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();bite()}});
resize();
</script>
</body></html>
